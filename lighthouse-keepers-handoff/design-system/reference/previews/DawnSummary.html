<!doctype html>
<html lang="en">
<head>
<script>(function(){var t=new URLSearchParams(location.search).get("theme");if(t)document.documentElement.setAttribute("data-theme",t);})();</script>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../lk-kit.css">
<script src="../lk-kit.js"></script>

<meta charset="utf-8">
<title>Dawn summary</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: var(--surface); color: var(--ink); font-family: var(--font-pixel); }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); padding: var(--space-4); align-items: start; }
  canvas.scene { width: 100%; height: auto; image-rendering: pixelated; display: block; }
  h1 { margin: 0 0 var(--space-2); }
  .big { font-size: 24px; line-height: 30px; margin: 0 0 var(--space-2); }
  .up { color: var(--success); font-size: 18px; line-height: 24px; display: flex; gap: var(--space-2); align-items: center; margin: 0 0 var(--space-4); }
  .stars { display: flex; gap: var(--space-2); align-items: center; font-size: 20px; margin-bottom: var(--space-4); }
  .shop { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
  .item { text-align: center; padding: var(--space-2); }
  .item canvas { margin: 0 auto; image-rendering: pixelated; display: block; }
  .item div { font-size: 16px; line-height: 22px; }
  .item small { font-size: 14px; color: var(--ink-muted); }
  .item.picked { box-shadow: 0 -4px 0 0 var(--accent), 0 4px 0 0 var(--accent), -4px 0 0 0 var(--accent), 4px 0 0 0 var(--accent); }
  .btns { margin-top: var(--space-4); }
</style>
</head>
<body>
<div class="wrap">
  <div><canvas class="scene" id="c" aria-label="Dawn over the harbour"></canvas></div>
  <div>
    <h1 class="game-title">Dawn!</h1>
    <p class="big">Together you brought 14 passengers home.</p>
    <p class="up"><span aria-hidden="true">▲</span> 3 more than last night</p>
    <div class="stars"><span id="star"></span> 6 sea stars to spend</div>
    <div class="shop" id="shop"></div>
    <div class="btns"><button class="lk-btn">Decorate</button><button class="lk-btn secondary">Goodnight</button></div>
  </div>
</div>
<script>
  var SHOP = [['flag', 'Flag', 3], ['pot', 'Flowers', 4], ['bunting', 'Bunting', 5], ['lantern', 'Lantern', 6], ['crab', 'Crab friend', 4], ['gull', 'Gull', 2]];
  function draw() {
    LK.harbour(document.getElementById('c'), { phase: 'dawn', route: false });
    var st = document.getElementById('star'); st.innerHTML = '';
    st.appendChild(LK.spriteCanvas(7, 5, 4, function (ctx, p) { LK.drawSprite(ctx, LK.SPRITES.star, 0, 0, p); }));
    var shop = document.getElementById('shop'); shop.innerHTML = '';
    SHOP.forEach(function (s, i) {
      var d = document.createElement('div'); d.className = 'item lk-panel' + (i === 1 ? ' picked' : '');
      var spr = LK.SPRITES[s[0]], sz = LK.spriteSize(spr);
      d.appendChild(LK.spriteCanvas(18, 10, 4, function (ctx, p) { LK.drawSprite(ctx, spr, Math.floor((18 - sz.w) / 2), Math.floor((10 - sz.h) / 2), p); }));
      var n = document.createElement('div'); n.textContent = s[1];
      var c = document.createElement('small'); c.textContent = s[2] + ' stars';
      d.appendChild(n); d.appendChild(c); shop.appendChild(d);
    });
  }
  LK.ready(draw); LK.onTheme(draw);
</script>
</body>
</html>
