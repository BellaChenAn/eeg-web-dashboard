<meta charset="utf-8">
<title>Lighthouse Keepers</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-pixel); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; shape-rendering:crispEdges; }
  .sea { fill:var(--sea); } .skydeep { fill:var(--sky); } .beam { fill:var(--beam); }
  .fog { fill:var(--fog-thick); } .stripe { fill:var(--stripe); } .tower { fill:var(--tower); }
  rect { rx:var(--radius-none); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:72px; line-height:.95; font-weight:600; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 4px; font-family:var(--font-read); font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      sea 200x208 slab bled off the bottom (the game is mostly water) · sky 272x152 bled off top and right (sky-deep would vanish into surface on night palettes) · beam 104x40, the one warm block, top-left of the slab like the lamp · fog-thick 200x136 bled off bottom-right · stripe 56x56 once (the lighthouse accent) — about 40% of 960x288
  arrangement one tall sea slab with satellites; gutters space-4 (16px), sides in space-2 (8px) multiples
  pattern     a literal motif, fog: 8px squares (one space-2 step, i.e. two art pixels at 4x) laid with a 4x4 ordered dither over the sea slab, dense at the top and thinning downward — the same dither the fog uses in game
  scales      squares and sides on the space-2 grid; corners radius-none (pixel art is square)
-->
